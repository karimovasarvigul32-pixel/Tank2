<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Battle City – 5 o'yinchi</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#000;color:#eee;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;padding:8px;-webkit-user-select:none;user-select:none}
h1{margin:8px 0;font:20px 'Press Start 2P',monospace;letter-spacing:2px;color:#e45c10}
.box{background:#222;border:3px solid #757575;padding:18px;max-width:380px;width:100%;text-align:center}
button,input{font:inherit;padding:10px 14px;border:2px solid #555;background:#2d2d2d;color:#eee;margin:4px;touch-action:manipulation}
button{cursor:pointer;background:#e8b000;color:#111;border-color:#e8b000;font-weight:700}
input{width:110px;text-align:center;text-transform:uppercase;letter-spacing:3px}
#code{font:32px 'Press Start 2P',monospace;color:#e8b000;margin:10px 0}
#game{display:none;flex-direction:column;align-items:center}
canvas{background:#757575;image-rendering:pixelated;width:min(98vw,calc((100vh - 90px)*1.0667));height:auto;aspect-ratio:512/480}
#hud{display:flex;gap:4px 14px;justify-content:center;font:10px 'Press Start 2P',monospace;margin:6px 0;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;margin-right:4px}
#pad{display:none;position:fixed;bottom:8px;left:0;right:0;justify-content:space-between;padding:0 14px;pointer-events:none}
#pad>div{pointer-events:auto}
#pad button{width:56px;height:56px;font-size:22px;margin:3px;padding:0;opacity:.75}
@media (pointer:coarse){#pad{display:flex}canvas{width:min(98vw,calc((100vh - 270px)*1.0667))}}
small{color:#999}
</style>
</head>
<body>
<h1>BATTLE CITY</h1>

<div id="menu" class="box">
  <p>5 tagacha o'yinchi birga dushman tanklarga qarshi kurashadi va shtabni (burgut) himoya qiladi.</p>
  <button id="mk">Xona yaratish</button>
  <hr style="border-color:#444;margin:14px 0">
  <input id="in" maxlength="4" placeholder="KOD">
  <button id="jn">Qo'shilish</button>
  <p id="msg" style="color:#ff8c8c;min-height:20px"></p>
  <small>Boshqaruv: strelkalar yoki WASD, o'q uzish — Space yoki J</small>
</div>

<div id="lobby" class="box" style="display:none">
  <div>Xona kodi:</div>
  <div id="code">----</div>
  <p>Do'stlarga shu kodni yuboring</p>
  <p id="cnt">O'yinchilar: 1/5</p>
  <button id="start">O'yinni boshlash</button>
  <p id="wait" style="display:none">Host o'yinni boshlashini kuting...</p>
</div>

<div id="game">
  <canvas id="c"></canvas>
  <div id="hud"></div>
  <button id="again" style="display:none">Qayta boshlash</button>
</div>

<div id="pad">
  <div><button data-k="l">◀</button><button data-k="u">▲</button><button data-k="d">▼</button><button data-k="r">▶</button></div>
  <div><button data-k="f" style="width:84px;height:84px;background:#e44;border-color:#e44;color:#fff">🔥</button></div>
</div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const T=16,N=26,W=N*T,OX=32,OY=16,SW=512,SH=480,DX=[0,1,0,-1],DY=[-1,0,1,0];
const PAL=[
 {l:'#f8d878',b:'#e8b000',d:'#a87000'},
 {l:'#b8f8b8',b:'#38b838',d:'#006800'},
 {l:'#a8c8fc',b:'#3878f8',d:'#0030a8'},
 {l:'#fcb8a0',b:'#e85c28',d:'#981800'},
 {l:'#e0c8fc',b:'#a070e8',d:'#5028a0'}];
const EN={l:'#fcfcfc',b:'#bcbcbc',d:'#6c6c6c'},IC={l:'#d82800',b:'#101010',d:'#101010'};
const SP=[128,256,64,320,0];
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');cv.width=SW;cv.height=SH;
let S=null,R=null,grid=null,peer=null,conn=null,conns={},me=-1,isHost=false,CODE='',fc=0,looping=false;
function show(id){['menu','lobby'].forEach(s=>$(s).style.display=s===id?'':'none');$('game').style.display=id==='game'?'flex':'none'}
if(document.fonts)document.fonts.load("14px 'Press Start 2P'");

/* ---------- SPRITES ---------- */
function spr(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));return c}
const rr=(g,x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x*2,y*2,w*2,h*2)};
const BR=spr(16,16,g=>{
  rr(g,0,0,8,8,'#8a8a8a');
  for(const [x,y,w] of [[0,0,7],[0,4,3],[4,4,4]]){rr(g,x,y,w,3,'#d03c14');rr(g,x,y,w,1,'#f87858')}
});
const ST=spr(16,16,g=>{rr(g,0,0,8,8,'#6c6c6c');rr(g,0,0,7,7,'#fcfcfc');rr(g,2,2,4,4,'#a8a8a8')});
const EH=[".......d","......gg",".....grg","g...gggg","gg.ggggg","ggggdggg","gggdgggg",".ggdgggg",".gdgdggg","..gdgggg","..dgdggg","...gdggg","....gddg","....gg.g","...gg..d","...g...."];
const EG=spr(32,32,g=>{EH.forEach((row,y)=>{for(let x=0;x<8;x++){const c=row[x];if(c==='.')continue;
  g.fillStyle=c==='g'?'#bcbcbc':c==='d'?'#6c6c6c':'#d82800';g.fillRect(x*2,y*2,2,2);g.fillRect((15-x)*2,y*2,2,2)}})});
const RB=spr(32,32,g=>{g.fillStyle='#6c6c6c';for(const [x,y,w,h] of [[4,4,8,4],[18,6,10,4],[8,16,14,8],[20,22,6,6],[2,24,8,4]])g.fillRect(x,y,w,h)});

function tank(x,y,d,P,inv,mv,sc){
  ctx.save();ctx.translate(x+16*sc,y+16*sc);ctx.rotate(d*Math.PI/2);ctx.scale(2*sc,2*sc);
  const ph=mv?(Date.now()/70|0)&1:0;
  for(const tx of [-8,4]){
    ctx.fillStyle=P.d;ctx.fillRect(tx,-8,4,16);
    ctx.fillStyle=P.b;for(let ty=-8+ph;ty<8;ty+=2)ctx.fillRect(tx,ty,4,1);
  }
  ctx.fillStyle=P.b;ctx.fillRect(-4,-5,8,12);
  ctx.fillStyle=P.l;ctx.fillRect(-4,-5,8,1);ctx.fillRect(-1,-8,2,7);
  ctx.fillStyle=P.d;ctx.fillRect(-2,-2,4,5);
  ctx.fillStyle=P.l;ctx.fillRect(-1,-1,2,2);
  if(inv&&((Date.now()/80|0)&1)){ctx.strokeStyle='#fff';ctx.lineWidth=1;ctx.strokeRect(-8.5,-8.5,17,17)}
  ctx.restore();
}
function boom(f){
  const big=f.k,a=f.t/(big?16:8),r=big?6+Math.sin(a*Math.PI)*14:3+a*7;
  ctx.save();ctx.translate(f.x,f.y);
  for(const [s,c,rot] of [[1,'#e45c10',0],[1,'#e45c10',Math.PI/4],[.65,'#f8b800',0],[.65,'#f8b800',Math.PI/4],[.3,'#fcfcfc',0]]){
    ctx.save();ctx.rotate(rot);ctx.fillStyle=c;ctx.fillRect(-r*s*.7,-r*s*.7,r*s*1.4,r*s*1.4);ctx.restore();
  }
  ctx.restore();
}

/* ---------- MAP (1-bosqich) ---------- */
function mkMap(){
  const g=new Array(N*N).fill(0);
  const f=(x,y,w,h,v)=>{for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)if(i>=0&&j>=0&&i<N&&j<N)g[j*N+i]=v};
  for(const x of [2,6,18,22])f(x,2,2,9,1);
  for(const x of [10,14])f(x,2,2,7,1);
  f(12,6,2,2,2);f(10,11,2,2,1);f(14,11,2,2,1);
  f(10,15,2,6,1);f(14,15,2,6,1);f(12,16,2,2,1);
  f(4,13,4,2,1);f(18,13,4,2,1);f(0,13,2,1,1);f(0,14,2,1,2);f(24,13,2,1,1);f(24,14,2,1,2);
  for(const x of [2,6,18,22])f(x,17,2,7,1);
  f(11,23,4,1,1);f(11,24,1,2,1);f(14,24,1,2,1);f(12,24,2,2,5);
  return g;
}

/* ---------- HOST LOGIC ---------- */
function addPlayer(slot){
  S.p[slot]={slot,x:SP[slot],y:384,d:0,alive:true,lives:3,score:0,m:-1,f:false,cd:0,inv:150,rt:0,mv:0};
  if(S.run)S.left=Math.min(30,S.left+5);
}
function newGame(){
  S.g=mkMap();S.gv++;S.e=[];S.b=[];S.fx=[];S.sp=60;S.st='play';S.run=true;
  const ps=Object.values(S.p);S.left=Math.min(30,6+5*ps.length);
  for(const p of ps)Object.assign(p,{x:SP[p.slot],y:384,d:0,alive:true,lives:3,score:0,cd:0,inv:150,mv:0});
}
function blocked(x,y,self){
  if(x<0||y<0||x+32>W||y+32>W)return true;
  for(let ty=y/T|0;ty<=(y+31.9)/T|0;ty++)for(let tx=x/T|0;tx<=(x+31.9)/T|0;tx++){
    const v=S.g[ty*N+tx];if(v===1||v===2||v===5)return true}
  for(const o of S.e.concat(Object.values(S.p).filter(p=>p.alive)))
    if(o!==self&&Math.abs(o.x-x)<32&&Math.abs(o.y-y)<32)return true;
  return false;
}
function step(t,sp){
  const nx=t.x+DX[t.d]*sp,ny=t.y+DY[t.d]*sp;
  if(!blocked(nx,ny,t)){t.x=nx;t.y=ny;return true}
  const h=t.d%2,c=h?t.y:t.x,dl=Math.round(c/32)*32-c; // burchakda sirpanish yordami
  if(dl!==0&&Math.abs(dl)<=10){
    const s=Math.sign(dl)*Math.min(Math.abs(dl),sp*1.5),px=h?t.x:t.x+s,py=h?t.y+s:t.y;
    if(!blocked(px,py,t)&&!blocked(px+DX[t.d]*sp,py+DY[t.d]*sp,t)){t.x=px;t.y=py;return true}
  }
  return false;
}
function turn(t,d){
  if(d===t.d)return;
  if(d%2!==t.d%2){
    const sx=d%2===0?Math.round(t.x/16)*16:t.x,sy=d%2===1?Math.round(t.y/16)*16:t.y;
    if(!blocked(sx,sy,t)){t.x=sx;t.y=sy}
  }
  t.d=d;
}
function shoot(t,o){S.b.push({x:t.x+16+DX[t.d]*16,y:t.y+16+DY[t.d]*16,d:t.d,o})}
const bm=(x,y,k)=>S.fx.push({x,y,t:0,k});

function tick(){
  S.fx=S.fx.filter(f=>++f.t<(f.k?16:8));
  if(S.st!=='play')return;
  const ps=Object.values(S.p);
  for(const p of ps){
    if(!p.alive){if(p.lives>0&&--p.rt<=0){p.alive=true;p.x=SP[p.slot];p.y=384;p.d=0;p.inv=150}continue}
    if(p.inv>0)p.inv--;if(p.cd>0)p.cd--;
    p.mv=0;if(p.m>=0){turn(p,p.m);p.mv=step(p,1.6)?1:0}
    if(p.f&&p.cd<=0&&!S.b.some(b=>b.o===p.slot)){shoot(p,p.slot);p.cd=15}
  }
  if(--S.sp<=0){
    S.sp=150;
    if(S.left>0&&S.e.length<4+ps.length){
      const sx=[0,192,384][Math.random()*3|0];
      if(!blocked(sx,0,null)){S.e.push({x:sx,y:0,d:2,cd:60,mv:0});S.left--}
    }
  }
  for(const e of S.e){
    if(e.cd>0)e.cd--;
    const ok=Math.random()>=0.012&&step(e,0.9);e.mv=ok?1:0;
    if(!ok){const r=Math.random();turn(e,r<.4?2:r<.55?(e.x<192?1:3):Math.random()*4|0)}
    if(e.cd<=0&&Math.random()<0.03){shoot(e,'e');e.cd=50}
  }
  for(let i=S.b.length-1;i>=0;i--){
    const b=S.b[i];let dead=0;
    for(let s=0;s<2&&!dead;s++){
      b.x+=DX[b.d]*2;b.y+=DY[b.d]*2;
      if(b.x<0||b.y<0||b.x>=W||b.y>=W){dead=1;break}
      for(const k of [-5,0,5]){
        const tx=(b.x+(b.d%2?0:k))/T|0,ty=(b.y+(b.d%2?k:0))/T|0;
        if(tx<0||ty<0||tx>=N||ty>=N)continue;
        const v=S.g[ty*N+tx];
        if(v===1){S.g[ty*N+tx]=0;S.gv++;dead=1}
        else if(v===2)dead=1;
        else if(v===5){for(let q=0;q<S.g.length;q++)if(S.g[q]===5)S.g[q]=6;S.gv++;S.st='lose';bm(208,400,1);dead=2}
      }
      if(dead)break;
      if(b.o==='e'){
        for(const p of ps)if(p.alive&&p.inv<=0&&Math.abs(b.x-p.x-16)<16&&Math.abs(b.y-p.y-16)<16){p.alive=false;p.lives--;p.rt=90;bm(p.x+16,p.y+16,1);dead=2;break}
      }else{
        for(let j=0;j<S.e.length;j++){const e=S.e[j];
          if(Math.abs(b.x-e.x-16)<16&&Math.abs(b.y-e.y-16)<16){S.e.splice(j,1);if(S.p[b.o])S.p[b.o].score+=100;bm(e.x+16,e.y+16,1);dead=2;break}}
      }
    }
    if(dead){if(dead===1)bm(Math.max(0,Math.min(W,b.x)),Math.max(0,Math.min(W,b.y)),0);S.b.splice(i,1)}
  }
  if(S.st==='play'){
    if(S.left===0&&S.e.length===0)S.st='win';
    else if(ps.every(p=>!p.alive&&p.lives<=0))S.st='lose';
  }
}
function snap(){
  return{p:Object.values(S.p).map(p=>[p.slot,Math.round(p.x),Math.round(p.y),p.d,p.alive?1:0,p.lives,p.score,p.inv>0?1:0,p.mv]),
    e:S.e.map(e=>[Math.round(e.x),Math.round(e.y),e.d,e.mv]),b:S.b.map(b=>[b.x,b.y]),
    fx:S.fx.map(f=>[f.x,f.y,f.t,f.k]),st:S.st,q:S.left};
}
let lastGv=-1;
function broadcast(){
  const m={t:'s',s:Object.assign({},R)};
  if(S.gv!==lastGv||fc%60===0){m.s.g=S.g.join('');lastGv=S.gv}
  for(const k in conns)if(conns[k].open)conns[k].send(m);
}
function loop(){
  if(looping)return;looping=true;
  setInterval(()=>{
    tick();
    if(++fc%3===0&&S.run){R=snap();grid=S.g;render();broadcast()}
  },1000/60);
}

/* ---------- NETWORK ---------- */
function lobbyUpdate(){
  const n=Object.keys(S.p).length;
  $('cnt').textContent="O'yinchilar: "+n+"/5";
  for(const k in conns)if(conns[k].open)conns[k].send({t:'lobby',n});
}
function createRoom(){
  isHost=true;me=0;
  S={p:{},g:mkMap(),gv:1,e:[],b:[],fx:[],left:0,sp:0,st:'lobby',run:false};
  CODE=Array.from({length:4},()=>'ABCDEFGHJKMNPQRSTUVWXYZ23456789'[Math.random()*31|0]).join('');
  peer=new Peer('bcity26-'+CODE);
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){peer.destroy();createRoom()}
    else $('msg').textContent='Xato: '+e.type;
  });
  peer.on('open',()=>{
    addPlayer(0);$('code').textContent=CODE;$('wait').style.display='none';$('start').style.display='';
    show('lobby');lobbyUpdate();
  });
  peer.on('connection',c=>{
    c.on('open',()=>{
      const slot=[1,2,3,4].find(s=>!S.p[s]);
      if(slot===undefined){c.send({t:'full'});setTimeout(()=>c.close(),300);return}
      conns[slot]=c;addPlayer(slot);c.send({t:'hello',slot});lastGv=-1;lobbyUpdate();
      c.on('data',m=>{if(m.t==='in'&&S.p[slot]){S.p[slot].m=m.m;S.p[slot].f=!!m.f}});
      c.on('close',()=>{delete conns[slot];delete S.p[slot];lobbyUpdate()});
    });
  });
}
function joinRoom(code){
  isHost=false;peer=new Peer();
  peer.on('error',e=>$('msg').textContent=e.type==='peer-unavailable'?"Bunday xona topilmadi":'Xato: '+e.type);
  peer.on('open',()=>{
    conn=peer.connect('bcity26-'+code,{reliable:true});
    conn.on('data',m=>{
      if(m.t==='hello'){me=m.slot;$('code').textContent=code;$('start').style.display='none';$('wait').style.display='';show('lobby')}
      else if(m.t==='lobby')$('cnt').textContent="O'yinchilar: "+m.n+"/5";
      else if(m.t==='full'){show('menu');$('msg').textContent="Xona to'lgan (5/5)"}
      else if(m.t==='s'){
        R=m.s;if(R.g)grid=R.g.split('').map(Number);
        if($('game').style.display==='none')show('game');
        render();
      }
    });
    conn.on('close',()=>{document.body.innerHTML='<h2 style="color:#ff8c8c">Host bilan aloqa uzildi. Sahifani yangilang (F5).</h2>'});
  });
}
$('mk').onclick=()=>{$('msg').textContent='';createRoom()};
$('jn').onclick=()=>{const c=$('in').value.trim().toUpperCase();if(c.length!==4){$('msg').textContent='4 belgili kodni kiriting';return}$('msg').textContent='';joinRoom(c)};
$('start').onclick=()=>{newGame();loop();show('game')};
$('again').onclick=()=>{newGame()};

/* ---------- INPUT ---------- */
const stack=[],IDX={u:0,r:1,d:2,l:3};let fire=false;
const KM={ArrowUp:'u',w:'u',W:'u',ArrowDown:'d',s:'d',S:'d',ArrowLeft:'l',a:'l',A:'l',ArrowRight:'r',d:'r',D:'r',' ':'f',j:'f',J:'f'};
function press(k,on){
  if(k==='f')fire=on;
  else{const i=stack.indexOf(k);if(i>=0)stack.splice(i,1);if(on)stack.push(k)}
  const m=stack.length?IDX[stack[stack.length-1]]:-1;
  if(isHost){if(S&&S.p[0]){S.p[0].m=m;S.p[0].f=fire}}
  else if(conn&&conn.open)conn.send({t:'in',m,f:fire});
}
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;const k=KM[e.key];if(k){e.preventDefault();if(!e.repeat)press(k,true)}});
addEventListener('keyup',e=>{const k=KM[e.key];if(k)press(k,false)});
document.querySelectorAll('#pad button').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();press(k,true)});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,()=>press(k,false)));
});

/* ---------- RENDER ---------- */
const FONT="'Press Start 2P',monospace";
function render(){
  if(!grid||!R)return;
  ctx.imageSmoothingEnabled=false;
  ctx.fillStyle='#757575';ctx.fillRect(0,0,SW,SH);
  ctx.save();ctx.translate(OX,OY);
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,W);
  for(let i=0;i<grid.length;i++){
    const v=grid[i];if(!v)continue;
    const x=i%N*T,y=(i/N|0)*T;
    if(v===1)ctx.drawImage(BR,x,y);
    else if(v===2)ctx.drawImage(ST,x,y);
    else if(i===24*N+12)ctx.drawImage(v===5?EG:RB,x,y);
  }
  for(const e of R.e)tank(e[0],e[1],e[2],EN,0,e[3],1);
  for(const p of R.p)if(p[4])tank(p[1],p[2],p[3],PAL[p[0]],p[7],p[8],1);
  for(const b of R.b){ctx.fillStyle='#bcbcbc';ctx.fillRect(b[0]-3,b[1]-3,6,6);ctx.fillStyle='#fcfcfc';ctx.fillRect(b[0]-1,b[1]-1,2,2)}
  for(const f of R.fx)boom({x:f[0],y:f[1],t:f[2],k:f[3]});
  if(R.st!=='play'){
    ctx.font='22px '+FONT;ctx.textAlign='center';
    const txt=R.st==='win'?'STAGE CLEAR':'GAME OVER';
    ctx.fillStyle='#000';ctx.fillText(txt,210,222);
    ctx.fillStyle=R.st==='win'?'#fcfcfc':'#d82800';ctx.fillText(txt,208,220);
  }
  ctx.restore();
  // o'ng panel
  const q=Math.min(R.q,30);
  for(let i=0;i<q;i++)tank(456+(i%3)*18,40+(i/3|0)*16,0,IC,0,0,.5);
  ctx.textAlign='left';ctx.font='12px '+FONT;
  const ps=R.p.slice().sort((a,b)=>a[0]-b[0]);
  ps.forEach((p,i)=>{
    const y=226+i*24;
    tank(456,y,0,PAL[p[0]],0,0,.5);
    ctx.fillStyle='#000';ctx.fillText(String(Math.max(0,p[5])),480,y+13);
    if(p[0]===me){ctx.fillStyle='#fcfcfc';ctx.fillRect(456,y+18,16,2)}
  });
  ctx.fillStyle='#000';ctx.fillRect(456,372,3,34);
  ctx.fillStyle='#e45c10';ctx.beginPath();ctx.moveTo(459,372);ctx.lineTo(486,381);ctx.lineTo(459,390);ctx.fill();
  ctx.fillStyle='#000';ctx.fillText('1',468,432);
  $('again').style.display=isHost&&R.st!=='play'?'':'none';
  $('hud').innerHTML=ps.map(p=>`<span><span class="dot" style="background:${PAL[p[0]].b}"></span>${p[0]+1}${p[0]===me?'*':''}: ${p[6]}</span>`).join('');
}
</script>
